title: Knowledge base
description: Medical KB
theme: just-the-docs

# Clean URLs: /temp-example/example/ instead of /temp-example/example.html
permalink: pretty

# Apply the theme's default layout to every page that has front matter.
# Pages can still override it (e.g. index.md uses layout: home).
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep Claude instruction files and internal slide sources out of the published site.
# Setting `exclude` replaces Jekyll's defaults, so those are repeated here.
exclude:
  - CLAUDE.md
  - .claude/
  - _slide-sources/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
